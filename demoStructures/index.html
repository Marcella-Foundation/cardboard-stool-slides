<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demonstration of Structures</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1b2e;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(242, 184, 75, 0.18) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1.2rem, 3vw, 2rem);
    padding: 2vh 4vw;
    animation: fadeInUp 1s ease-out;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    color: #ffffff;
    font-size: clamp(2rem, 5.5vw, 4rem);
    font-weight: 900;
    text-align: center;
    letter-spacing: -1px;
    line-height: 1.15;
    text-shadow: 0 2px 20px rgba(242, 184, 75, 0.3);
  }

  h1 span {
    color: #f2b84b;
  }

  .subtitle {
    color: rgba(255, 255, 255, 0.6);
    font-size: clamp(1rem, 2.2vw, 1.3rem);
    text-align: center;
    max-width: 40ch;
    line-height: 1.4;
  }

  .link-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #f2b84b;
    color: #0b1f1a;
    padding: clamp(12px, 1.8vw, 16px) clamp(24px, 3.4vw, 34px);
    border-radius: 50px;
    font-weight: 700;
    font-size: clamp(1rem, 2.2vw, 1.2rem);
    letter-spacing: 0.3px;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(242, 184, 75, 0.4);
    transition: transform 0.2s ease;
  }

  .link-badge:hover {
    transform: scale(1.05);
  }

  .link-url {
    color: rgba(255, 255, 255, 0.4);
    font-size: clamp(0.75rem, 1.4vw, 0.9rem);
    text-align: center;
    word-break: break-all;
    max-width: 60ch;
  }
</style>
</head>
<body>

<div class="content">
  <h1>Demonstration of <span>Structures</span></h1>
  <p class="subtitle">Had Claude generate example graphics/animations for inspiration</p>
  <a class="link-badge" href="https://claude.ai/code/artifact/dbd2eabd-3194-4e8a-92ab-654aa00e72a4" target="_blank" rel="noopener">🔗 View the Artifact</a>
  <div class="link-url">claude.ai/code/artifact/dbd2eabd-3194-4e8a-92ab-654aa00e72a4</div>
</div>

</body>
</html>
