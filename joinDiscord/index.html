<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Our Discord</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1b2e;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Subtle radial glow behind content */
  body::before {
    content: '';
    position: absolute;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(88, 101, 242, 0.2) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  /* Floating particles - blurple family only */
  .particle {
    position: absolute;
    border-radius: 50%;
    bottom: -20px;
    animation: float linear infinite;
    z-index: 0;
    opacity: 0;
  }

  @keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.25; }
    90% { opacity: 0.25; }
    100% { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1rem, 2.5vw, 1.8rem);
    animation: fadeInUp 1s ease-out;
    padding: 2vh 4vw;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Discord logo */
  .discord-logo {
    width: clamp(60px, 8vw, 90px);
    height: clamp(60px, 8vw, 90px);
    filter: drop-shadow(0 0 20px rgba(88, 101, 242, 0.5));
    animation: bounce 2.5s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  h1 {
    color: #ffffff;
    font-size: clamp(2.2rem, 6vw, 4rem);
    font-weight: 900;
    text-align: center;
    letter-spacing: -1px;
    line-height: 1.1;
    text-shadow: 0 2px 20px rgba(88, 101, 242, 0.3);
  }

  h1 span {
    color: #7289da;
  }

  .subtitle {
    color: rgba(255, 255, 255, 0.5);
    font-size: clamp(0.9rem, 2vw, 1.3rem);
    font-weight: 400;
    text-align: center;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* QR container with glow */
  .qr-wrapper {
    position: relative;
    padding: clamp(12px, 2vw, 22px);
    background: #fff;
    border-radius: 24px;
    box-shadow:
      0 0 40px rgba(88, 101, 242, 0.35),
      0 0 80px rgba(88, 101, 242, 0.1);
    animation: pulse-glow 4s ease-in-out infinite;
    transition: transform 0.3s ease;
  }

  .qr-wrapper:hover {
    transform: scale(1.05);
  }

  @keyframes pulse-glow {
    0%, 100% {
      box-shadow:
        0 0 40px rgba(88, 101, 242, 0.35),
        0 0 80px rgba(88, 101, 242, 0.1);
    }
    50% {
      box-shadow:
        0 0 60px rgba(114, 137, 218, 0.5),
        0 0 120px rgba(114, 137, 218, 0.15);
    }
  }

  .qr-wrapper img {
    width: min(300px, 40vh, 60vw);
    height: min(300px, 40vh, 60vw);
    display: block;
    border-radius: 8px;
  }

  /* Scan me badge */
  .scan-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #5865f2;
    color: #fff;
    padding: clamp(10px, 1.5vw, 14px) clamp(20px, 3vw, 32px);
    border-radius: 50px;
    font-weight: 700;
    font-size: clamp(1rem, 2vw, 1.2rem);
    letter-spacing: 1px;
    box-shadow: 0 4px 20px rgba(88, 101, 242, 0.4);
    animation: wiggle 3s ease-in-out infinite;
  }

  .scan-badge .arrow {
    display: inline-block;
    animation: point 1.5s ease-in-out infinite;
    font-size: 1.3rem;
  }

  @keyframes point {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(4px); }
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    15% { transform: rotate(-1.5deg); }
    30% { transform: rotate(1.5deg); }
    45% { transform: rotate(0deg); }
  }
</style>
</head>
<body>

<!-- Floating particles - unified blurple palette -->
<script>
  const colors = ['#5865f2','#7289da','#99aab5','#4752c4','#8ea1e1'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 10 + 3;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (Math.random() * 10 + 8) + 's';
    p.style.animationDelay = (Math.random() * 8) + 's';
    document.body.appendChild(p);
  }
</script>

<div class="content">
  <!-- Discord Logo SVG -->
  <svg class="discord-logo" viewBox="0 0 127.14 96.36" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z" fill="#5865F2"/>
  </svg>

  <div>
    <h1>Join the <span>Makerspace</span></h1>
    <p class="subtitle">Marcella Foundation</p>
  </div>

  <div class="qr-wrapper">
    <img src="Discord QR.png" alt="QR Code to join Discord">
  </div>

  <div class="scan-badge">
    <span class="arrow">&#x1F4F1;</span> Scan to Join
  </div>
</div>

</body>
</html>
