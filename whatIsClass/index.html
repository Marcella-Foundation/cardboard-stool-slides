<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What is this class?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1b2e;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(242, 184, 75, 0.18) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1.2rem, 3vw, 2rem);
    padding: 2vh 4vw;
    animation: fadeInUp 1s ease-out;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    color: #ffffff;
    font-size: clamp(2rem, 5.5vw, 4rem);
    font-weight: 900;
    text-align: center;
    letter-spacing: -1px;
    line-height: 1.15;
    text-shadow: 0 2px 20px rgba(242, 184, 75, 0.3);
  }

  h1 span {
    color: #f2b84b;
  }

  .subpoints {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
  }

  .subpoints .point {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #f2b84b;
    font-size: clamp(1.1rem, 2.6vw, 1.6rem);
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .subpoints .point::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f2b84b;
    box-shadow: 0 0 10px rgba(242, 184, 75, 0.7);
  }
</style>
</head>
<body>

<div class="content">
  <h1>What is <span>this class?</span></h1>
  <div class="subpoints">
    <div class="point">Bring a computer</div>
    <div class="point">Help us test real makerspace stuff</div>
  </div>
</div>

</body>
</html>
